name: Daily AI News Scanner

on:
  schedule:
    # 7:00 AM UTC corresponds to 12:00 PM PKT
    - cron: '0 7 * * *'
  workflow_dispatch: # Enables manual triggering from GitHub UI

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4 google-genai

      - name: Execute News Scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_news.py

      - name: Commit and Push Updated News Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add news_data.json
          git commit -m "Automated daily news update [12 PM PKT]" || exit 0
          git push
